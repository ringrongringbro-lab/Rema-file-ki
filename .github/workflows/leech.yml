name: Leech Bot Worker

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Source download link'
        required: true
      name:
        description: 'Series/Movie Name'
        required: false
        default: 'Unknown'
      season:
        description: 'Season'
        required: false
        default: '01'
      voice:
        description: 'Voice/Language'
        required: false
        default: 'Hindi'
      quality:
        description: 'Quality'
        required: false
        default: '1080p'
      episode:
        description: 'Episode (single-file leech only)'
        required: false
        default: '01'
      chat_id:
        description: 'Telegram Chat ID to deliver to'
        required: true
      trigger_msg_id:
        description: 'Status message ID to edit/delete'
        required: false
        default: 'none'

jobs:
  leech_job:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # runner hard cap is 360; leave a small buffer

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'   # pip cache reused across runs -> faster installs

      - name: Install aria2 + 7zip (apt cache speeds up repeat runs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2 p7zip-full

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run Leech Worker
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          URL: ${{ github.event.inputs.url }}
          META_NAME: ${{ github.event.inputs.name }}
          META_SEASON: ${{ github.event.inputs.season }}
          META_VOICE: ${{ github.event.inputs.voice }}
          META_QUALITY: ${{ github.event.inputs.quality }}
          MANUAL_EP: ${{ github.event.inputs.episode }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          TRIGGER_MSG_ID: ${{ github.event.inputs.trigger_msg_id }}
        run: python leech_worker.py
